apiVersion: apps/v1
kind: Deployment
metadata:
  name: fountain-repro-http
  namespace: fountain-repro
  labels:
    app: fountain-repro-http
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fountain-repro-http
  template:
    metadata:
      labels:
        app: fountain-repro-http
    spec:
      containers:
        - name: app
          image: nginx:stable
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - containerPort: 80
